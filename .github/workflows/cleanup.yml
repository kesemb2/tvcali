name: Cleanup

# One-time: removes the releases and tags made before the history was squashed (they kept the old commits
# reachable). Explicit list only; safe to run again. Delete this file once it has run.
on:
  push:
    paths:
      - '.github/workflows/cleanup.yml'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete pre-squash releases and tags
        run: |
          for tag in build-1 build-2 build-3 build-4 build-5 build-6 build-7 patterns-v1; do
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes && echo "deleted release $tag"
            fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" >/dev/null 2>&1 && echo "deleted tag $tag" || true
          done
